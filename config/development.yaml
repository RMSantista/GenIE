environment: development
log_level: DEBUG
debug: true

api:
  host: "0.0.0.0"
  port: 8000

storage:
  type: json
  path: "./data/search_library/patterns.json"

llm:
  provider: anthropic
  model: "claude-sonnet-4-20250514"
  temperature: 0.0
  max_tokens: 4096

behavior:
  use_search_library: true
  auto_create_patterns: true
  layout_independent: true
  update_on_change: true
